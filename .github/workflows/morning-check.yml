# The morning check (CoinSnipe P0.1b, 19 Nov 2026).
# Every morning at 01:30 UTC it reads last-run.json. If last night's run is
# missing, was skipped or failed, this check fails, and GitHub emails the
# owner of this project. GitHub sometimes starts scheduled checks late.
name: morning-check
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  last-night:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Did last night's run finish?
        run: |
          python3 - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          def say(ok, line):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write(("### ✅ " if ok else "### ❌ ") + line + "\n")
              print(line)
              sys.exit(0 if ok else 1)
          try:
              run = json.load(open("last-run.json")).get("last_run") or {}
          except Exception:
              say(False, "No run status file yet: the nightly job has not reported.")
          date, status = run.get("date"), run.get("status")
          if date != today:
              say(False, f"The nightly job did not run last night ({today} UTC). Last run on record: {date or 'none'}.")
          if status == "skipped":
              say(False, f"Last night ({today} UTC) was skipped on purpose (ops/skip-dates.txt).")
          if status != "ok":
              say(False, f"Last night's run ({today} UTC) did not finish: {status}.")
          say(True, f"Last night's run finished: {today}, {run.get('started_at')} to {run.get('finished_at')} UTC.")
          PY
